spring.application.name=agri-b2b-backend
server.port=8081

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/agrib2b?currentSchema=agrib2b}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:ajeet157}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.schema=agrib2b

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=agrib2b

app.security.jwt.secret=${JWT_SECRET:replace-this-secret-in-production-with-at-least-32-characters}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}
app.document.storage-provider=${DOCUMENT_STORAGE_PROVIDER:LOCAL}
app.document.local-base-dir=${APP_UPLOAD_DIR:uploads}
app.document.s3.bucket=${S3_BUCKET:}
app.document.s3.region=${S3_REGION:}
app.document.s3.key-prefix=${S3_KEY_PREFIX:}
app.document.s3.public-base-url=${S3_PUBLIC_BASE_URL:}
# Legacy alias kept for backward compatibility with old env templates.
app.upload.base-dir=${APP_UPLOAD_DIR:uploads}
app.customer.google.client-id=${GOOGLE_CLIENT_ID:}
app.cashfree.enabled=${CASHFREE_ENABLED:false}
app.cashfree.base-url=${CASHFREE_BASE_URL:https://sandbox.cashfree.com/pg}
app.cashfree.api-version=${CASHFREE_API_VERSION:2023-08-01}
app.cashfree.client-id=${CASHFREE_CLIENT_ID:}
app.cashfree.client-secret=${CASHFREE_CLIENT_SECRET:}
app.cashfree.enforce-webhook-signature=${CASHFREE_WEBHOOK_ENFORCE_SIGNATURE:false}
app.cashfree.webhook-notify-url=${CASHFREE_WEBHOOK_NOTIFY_URL:}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
